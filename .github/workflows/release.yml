# Every push to main: run the tests, build the desktop app for Windows, Mac and Linux, and publish a GitHub release
# (v1.0.<run number>) with one download per platform. The newest one is always at /releases/latest.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, asset: RobotRally-windows-x64 }
          - { rid: osx-arm64, os: macos-latest, asset: RobotRally-mac-apple-silicon }
          - { rid: osx-x64, os: macos-latest, asset: RobotRally-mac-intel }
          - { rid: linux-x64, os: ubuntu-latest, asset: RobotRally-linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Macs load native libraries as separate signed files, so they stay out of the single-file bundle there.
      - name: Publish
        run: |
          native=true
          [[ "${{ matrix.rid }}" == osx-* ]] && native=false
          dotnet publish src/RobotRally.Desktop -c Release -r ${{ matrix.rid }} -o publish \
            -p:Version=$VERSION -p:IncludeNativeLibrariesForSelfExtract=$native
          ls -la publish

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win')
        run: |
          mkdir -p "dist/Robot Rally"
          cp -R publish/. "dist/Robot Rally/"
          mv "dist/Robot Rally/RobotRally.Desktop.exe" "dist/Robot Rally/Robot Rally.exe"
          cd dist && 7z a -tzip "../${{ matrix.asset }}.zip" "Robot Rally" > /dev/null

      # One-file AppImage (appimagetool pinned and checksummed). It uses the system's WebKitGTK rather than bundling it.
      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux')
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          src/RobotRally.Desktop/linux/build-appimage.sh publish "${{ matrix.asset }}.AppImage" ./appimagetool

      # A Mac app: the executable (and its native libraries) in Contents/MacOS, the web files in Contents/Resources,
      # ad-hoc signed so Apple silicon will run it.
      - name: Package (Mac)
        if: startsWith(matrix.rid, 'osx')
        run: |
          app="dist/Robot Rally.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp publish/RobotRally.Desktop "$app/Contents/MacOS/RobotRally"
          find publish -maxdepth 1 -name '*.dylib' -exec cp {} "$app/Contents/MacOS/" \;
          cp -R publish/wwwroot publish/*.json "$app/Contents/Resources/"
          sed "s/VERSION/$VERSION/g" src/RobotRally.Desktop/macos/Info.plist > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "${{ matrix.asset }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          gh release create "v$VERSION" assets/* \
            --target "$GITHUB_SHA" \
            --title "Robot Rally $VERSION" \
            --notes-file .github/release-notes.md \
            --latest
