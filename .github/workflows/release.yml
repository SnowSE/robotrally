# Every push to main: run the tests, build the desktop app for Windows, Mac and Linux with Velopack, and publish a
# GitHub release (v1.0.<run number>). Installed copies find the new release by themselves, download it in the
# background, and offer a restart (src/RobotRally.Desktop/DesktopUpdates.cs).
#
# Each platform is packaged on its own kind of runner: Velopack builds the Windows installer only on Windows and needs
# macOS's own tools for the .app and .pkg.
name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in a row queue rather than race: cancelling half a release would publish some platforms and not others.
concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}
  VPK_VERSION: 1.2.161 # keep in step with the Velopack package in RobotRally.Desktop.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  package:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          # channel: which update feed an installed copy follows. Each platform needs its own; the two Macs differ
          # by chip, so the Intel one gets a channel of its own.
          - { rid: win-x64, os: windows-latest, channel: win }
          - { rid: osx-arm64, os: macos-latest, channel: osx }
          - { rid: osx-x64, os: macos-latest, channel: osx-x64 }
          - { rid: linux-x64, os: ubuntu-latest, channel: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the packaging tool
        run: dotnet tool install -g vpk --version $VPK_VERSION

      - name: Publish
        run: dotnet publish src/RobotRally.Desktop -c Release -r ${{ matrix.rid }} -o publish -p:Version=$VERSION

      - name: Package for Windows
        if: startsWith(matrix.rid, 'win')
        run: >
          vpk pack --packId RobotRally --packVersion $VERSION --packTitle "Robot Rally"
          --packDir publish --mainExe RobotRally.Desktop.exe
          --icon src/RobotRally.Desktop/icons/robot-rally.ico
          --runtime ${{ matrix.rid }} --channel ${{ matrix.channel }}

      # Our Info.plist rather than Velopack's generic one, so the window may load the game from http://localhost.
      - name: Package for macOS
        if: startsWith(matrix.rid, 'osx')
        run: |
          sed "s/__VERSION__/$VERSION/g" src/RobotRally.Desktop/macos/Info.plist > "$RUNNER_TEMP/Info.plist"
          vpk pack --packId RobotRally --packVersion $VERSION --packTitle "Robot Rally" \
            --packDir publish --mainExe RobotRally.Desktop \
            --icon src/RobotRally.Desktop/icons/robot-rally.icns --plist "$RUNNER_TEMP/Info.plist" \
            --runtime ${{ matrix.rid }} --channel ${{ matrix.channel }}

      - name: Package for Linux
        if: startsWith(matrix.rid, 'linux')
        run: >
          vpk pack --packId RobotRally --packVersion $VERSION --packTitle "Robot Rally"
          --packDir publish --mainExe RobotRally.Desktop
          --icon src/RobotRally.Desktop/icons/robot-rally.png
          --runtime ${{ matrix.rid }} --channel ${{ matrix.channel }}

      - uses: actions/upload-artifact@v4
        with:
          name: robotrally-${{ matrix.rid }}
          path: Releases/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Keep the installers and the update feed (releases.<channel>.json plus the .nupkg packages: installed copies
      # read these from the latest release, so they must stay). Drop the Squirrel-era RELEASES files and the
      # assets.<channel>.json notes for `vpk upload`, which nothing here reads.
      - name: Gather the files
        run: |
          mkdir -p Releases
          find artifacts -type f -exec cp -n {} Releases/ \;
          rm -f Releases/RELEASES Releases/RELEASES-* Releases/assets.*.json
          ls -la Releases

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Releases/* \
            --target "$GITHUB_SHA" \
            --title "Robot Rally $VERSION" \
            --notes-file .github/release-notes.md \
            --latest
